name: Record gameplay GIF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout doom-flow
        uses: actions/checkout@v5

      - name: Checkout Flow
        uses: actions/checkout@v5
        with:
          repository: flooooooooooow/flow
          path: flow

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flow Python deps and Pillow
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r flow/requirements.txt pillow
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: 'emsdk-cache'

      - name: Install LLVM (for mlir-opt)
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz -O /tmp/llvm.tar.xz
          mkdir -p /tmp/llvm && tar xf /tmp/llvm.tar.xz -C /tmp/llvm --strip-components=1
          echo "/tmp/llvm/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        env:
          FLOW_DIR: ${{ github.workspace }}/flow
          WASM_ENVIRONMENT: web,node
        run: |
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh --doom-only

      - name: Record GIF
        env:
          FLOW_DIR: ${{ github.workspace }}/flow
          SMOKE_TIMEOUT: 120000
        run: |
          node scripts/record_wasm_gif.js \
            --frames 120 --skip 2 --fps 15 --width 320 \
            --out media/doom.gif

      - name: Upload gameplay GIF
        uses: actions/upload-artifact@v7
        with:
          name: doom-flow-gameplay-gif
          path: media/doom.gif
          if-no-files-found: error
