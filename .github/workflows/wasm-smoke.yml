name: WASM smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Flow
        uses: actions/checkout@v5
        with:
          repository: flooooooooooow/flow
          path: flow

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flow Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r flow/requirements.txt
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: 'emsdk-cache'

      - name: Install LLVM (for mlir-opt)
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz -O /tmp/llvm.tar.xz
          mkdir -p /tmp/llvm && tar xf /tmp/llvm.tar.xz -C /tmp/llvm --strip-components=1
          echo "/tmp/llvm/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        env:
          FLOW_DIR: ${{ github.workspace }}/flow
          WASM_ENVIRONMENT: web,node
        run: |
          chmod +x scripts/build_wasm.sh
          ./scripts/build_wasm.sh --doom-only

      - name: Smoke test
        env:
          SMOKE_TIMEOUT: 30000
        run: node scripts/smoke_test_mlir.js

  byte-identical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Flow
        uses: actions/checkout@v5
        with:
          repository: flooooooooooow/flow
          path: flow

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flow Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r flow/requirements.txt
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1
          actions-cache-folder: 'emsdk-cache'

      - name: Install LLVM (for mlir-opt)
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz -O /tmp/llvm.tar.xz
          mkdir -p /tmp/llvm && tar xf /tmp/llvm.tar.xz -C /tmp/llvm --strip-components=1
          echo "/tmp/llvm/bin" >> "$GITHUB_PATH"

      - name: Byte-identicality test (C vs MLIR)
        env:
          FLOW_DIR: ${{ github.workspace }}/flow
          WASM_ENVIRONMENT: web,node
          SMOKE_TIMEOUT: 120000
        run: |
          chmod +x scripts/run_byte_identical.sh
          ./scripts/run_byte_identical.sh

      - name: Gameplay byte-identicality test (C vs MLIR)
        env:
          FLOW_DIR: ${{ github.workspace }}/flow
          WASM_ENVIRONMENT: web,node
          SMOKE_TIMEOUT: 300000
        run: |
          chmod +x scripts/run_gameplay_test.sh
          ./scripts/run_gameplay_test.sh
